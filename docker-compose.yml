# Voicebox — CPU build (default)
# For AMD ROCm GPU acceleration use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build

services:
  voicebox:
    build: .
    image: voicebox:local
    container_name: voicebox
    restart: unless-stopped

    ports:
      - "17493:17493"

    volumes:
      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ${APP_DATA_DIR}/output:/app/data/generations

      # Bind-mount for profiles, DB, cache (persists across container restarts)
      - ${APP_DATA_DIR}/voicebox-data:/app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - ${APP_DATA_DIR}/huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  voicebox-net:
    driver: bridge
